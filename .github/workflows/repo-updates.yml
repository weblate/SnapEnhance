name: Repository Updates
on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Sending Update Message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Commit Info
        id: info
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "trigger=push" >> $GITHUB_OUTPUT
            COUNT=$(jq '.commits | length' $GITHUB_EVENT_PATH)
            if [ "$COUNT" -eq 1 ]; then
              echo "header=New commit has been pushed to the ${{ github.ref_name }} branch!" >> $GITHUB_OUTPUT
            else
              echo "header=New commits have been pushed to the ${{ github.ref_name }} branch!" >> $GITHUB_OUTPUT
            fi
            {
              echo 'commit_list<<EOF'
              jq -r --arg repo "${{ github.server_url }}/${{ github.repository }}" '.commits | reverse | .[] | "<a href=\"\($repo)/commit/\(.id)\">#\(.id | .[0:7])</a> - \((.message | split("\n")[0] | split(" - ")[0]) | @html)"' $GITHUB_EVENT_PATH
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Sending Message for Push
        if: steps.info.outputs.trigger == 'push'
        uses: docker://ghcr.io/appleboy/drone-telegram:1.4.0
        env:
          PLUGIN_TO: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLUGIN_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PLUGIN_DISABLE_WEB_PAGE_PREVIEW: "true"
          PLUGIN_FORMAT: "html"
          PLUGIN_MESSAGE: |
            <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a>

            ${{ steps.info.outputs.header }}
            ${{ steps.info.outputs.commit_list }}