name: Debug CI
on:
  workflow_dispatch:

jobs:
  job_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Kill Ghost Processes
        run: |
          ./gradlew --stop || true
          rm -rf .gradle/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          rm -f local.properties
          echo "sdk.dir=/opt/android-sdk" > local.properties
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.1.12297006
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export CARGO_HOME=/root/.cargo
          export RUSTUP_HOME=/root/.rustup
          export PATH="/root/.cargo/bin:/usr/bin:/usr/local/bin:$ANDROID_HOME/platform-tools:$JAVA_HOME/bin:$PATH"
          export CC=/usr/bin/gcc
          export CXX=/usr/bin/g++
          export GRADLE_OPTS="-Xmx4g -XX:+UseParallelGC -Dorg.gradle.daemon=false"
          npm install typescript -g
          ./gradlew assembleArmv8Debug --no-daemon --stacktrace -Dorg.gradle.workers.max=1 -Dcom.android.tools.r8.threads=1
          ./gradlew assembleArmv7Debug --no-daemon --stacktrace -Dorg.gradle.workers.max=1 -Dcom.android.tools.r8.threads=1

      - name: Determine the latest Build Tools version
        shell: bash
        run: |
          SDK_PATH="/opt/android-sdk"
          VERSION=$(ls "$SDK_PATH/build-tools/" | sort -V | tail -n 1)
          echo "Found Build Tools Version: $VERSION"
          echo "BUILD_TOOL_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Sign ARMV8 APK
        id: sign_armv8
        uses: actions/sign-android-release@master
        with:
          releaseDirectory: app/build/outputs/apk/armv8/debug
          signingKeyBase64: ${{ secrets.JAVA_KEYSTORE_DATA }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          fileExtension: apk
        env:
          ANDROID_HOME: /opt/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Sign ARMV7 APK
        id: sign_armv7
        uses: actions/sign-android-release@master
        with:
          releaseDirectory: app/build/outputs/apk/armv7/debug/
          signingKeyBase64: ${{ secrets.JAVA_KEYSTORE_DATA }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          fileExtension: apk
        env:
          ANDROID_HOME: /opt/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Get current build version
        id: version-env
        run: |
          ./gradlew getVersion
          echo "version=$(cat app/build/version.txt)" >> $GITHUB_ENV
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Delete Unsigned APKs
        run: |
          find app/build/outputs/apk/armv8/debug/ -type f ! -name '*-signed*' -delete
          find app/build/outputs/apk/armv7/debug/ -type f ! -name '*-signed*' -delete

      - name: Rename APK Files
        run: |
          mv app/build/outputs/apk/armv8/debug/*.apk app/build/outputs/apk/armv8/debug/SE-Extended-${{ env.version }}-ARMV8-${{ steps.version-env.outputs.sha_short }}.apk
          mv app/build/outputs/apk/armv7/debug/*.apk app/build/outputs/apk/armv7/debug/SE-Extended-${{ env.version }}-ARMV7-${{ steps.version-env.outputs.sha_short }}.apk

      - name: Upload ARMV7 APK
        uses: actions/upload-artifact@v3
        with:
          name: SE-Extended-ARMV7-Debug
          path: app/build/outputs/apk/armv7/debug/*.apk

      - name: Upload ARMV8 APK
        uses: actions/upload-artifact@v3
        with:
          name: SE-Extended-ARMV8-Debug
          path: app/build/outputs/apk/armv8/debug/*.apk